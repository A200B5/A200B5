<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a1428"/>
<stop offset="0.55" stop-color="#101f45"/>
<stop offset="1" stop-color="#1a3a7a"/>
</linearGradient>
<linearGradient id="wavefill" x1="0" x2="1">
<stop offset="0" stop-color="#3b82f6" stop-opacity=".30"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity=".05"/>
</linearGradient>
<clipPath id="round"><rect width="900" height="240" rx="16"/></clipPath>
</defs>
<style>
.name{font:700 46px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
.role{font:500 26px 'Courier New',monospace;fill:#93c5fd}
.cursor{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.wave-a{animation:drift 10s linear infinite}
.wave-b{animation:drift 16s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-450px)}}
.spark{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.fadein{animation:rise 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.r0{opacity:0;animation:show0 12s infinite}
@keyframes show0{0%{opacity:0}1.0%{opacity:1}30.0%{opacity:1}33.0%{opacity:0}100%{opacity:0}}
.k0{animation:type0 12s infinite steps(24,end)}
@keyframes type0{0%{width:0}1.0%{width:0}16.0%{width:520px}33.0%{width:520px}100%{width:0}}
.r1{opacity:0;animation:show1 12s infinite}
@keyframes show1{0%{opacity:0}34.3%{opacity:1}63.3%{opacity:1}66.3%{opacity:0}100%{opacity:0}}
.k1{animation:type1 12s infinite steps(24,end)}
@keyframes type1{0%{width:0}34.3%{width:0}49.3%{width:520px}66.3%{width:520px}100%{width:0}}
.r2{opacity:0;animation:show2 12s infinite}
@keyframes show2{0%{opacity:0}67.7%{opacity:1}96.7%{opacity:1}99.7%{opacity:0}100%{opacity:0}}
.k2{animation:type2 12s infinite steps(24,end)}
@keyframes type2{0%{width:0}67.7%{width:0}82.7%{width:520px}99.7%{width:520px}100%{width:0}}
</style>
<g clip-path="url(#round)">
<rect width="900" height="240" fill="url(#bg)"/>
<g class="wave-a"><path d="M0 192 Q112 154 225 192 T450 192 T675 192 T900 192 T1125 192 T1350 192 V240 H0Z" fill="url(#wavefill)"/></g>
<g class="wave-b"><path d="M0 208 Q112 178 225 208 T450 208 T675 208 T900 208 T1125 208 T1350 208 V240 H0Z" fill="url(#wavefill)"/></g>
<circle class="spark" cx="750" cy="58" r="6" fill="#60a5fa" opacity=".55"/>
<circle class="spark" style="animation-delay:-1.7s" cx="812" cy="104" r="4" fill="#3b82f6" opacity=".55"/>
<circle class="spark" style="animation-delay:-3.4s" cx="700" cy="118" r="3" fill="#bfdbfe" opacity=".55"/>
<text x="60" y="96" class="name fadein">Ahmed Bakr</text>
<g class="r0"><clipPath id="c0"><rect x="60" y="120" height="50" class="k0"/></clipPath><text x="60" y="153" clip-path="url(#c0)" class="role">Frontend Developer</text></g>
<g class="r1"><clipPath id="c1"><rect x="60" y="120" height="50" class="k1"/></clipPath><text x="60" y="153" clip-path="url(#c1)" class="role">React &amp; Node.js apps, shipped live</text></g>
<g class="r2"><clipPath id="c2"><rect x="60" y="120" height="50" class="k2"/></clipPath><text x="60" y="153" clip-path="url(#c2)" class="role">Open to freelance work</text></g>
<text x="60" y="153" class="role cursor">_</text>
</g>
</svg>
